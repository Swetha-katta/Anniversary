<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Happy Anniversary ❤️</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            overflow: hidden;

            font-family: Georgia, "Times New Roman", serif;

            background:
                linear-gradient(
                    135deg,
                    #fffaf8,
                    #f6e2df
                );

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            position: relative;
        }


        /* FALLING ROSE PETALS */

.petal {
    position: fixed;
    top: -40px;

    width: 18px;
    height: 25px;

    background: linear-gradient(
        135deg,
        #f6a0ad,
        #c73558,
        #8f1838
    );

    border-radius: 80% 0 80% 0;

    opacity: 0.85;

    z-index: 1;
    pointer-events: none;

    animation: petalFall linear infinite;
}

@keyframes petalFall {

    0% {
        transform: translateY(-40px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 0.9;
    }

    50% {
        transform: translateY(50vh) translateX(35px)
                   rotate(180deg);
    }

    100% {
        transform: translateY(110vh) translateX(-35px)
                   rotate(360deg);
        opacity: 0;
    }
}

        @keyframes fall {

            0% {

                transform:
                    translateY(-50px)
                    rotate(0deg);

                opacity: 0;

            }

            10% {

                opacity: 1;

            }

            100% {

                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0.8;

            }

        }


        /* MAIN CONTENT */

        .anniversary-content {

            position: relative;

            z-index: 5;

            width: 90%;

            max-width: 800px;

            padding: 30px;
        }


        .small-heading {

            font-size: 18px;

            letter-spacing: 5px;

            color: #80676a;

            text-transform: uppercase;

            margin-bottom: 15px;
        }


        .title {

            font-size: clamp(
                50px,
                9vw,
                100px
            );

            font-weight: normal;

            color: #9d6267;

            line-height: 1;

            margin-bottom: 15px;
        }


        .names {

            font-size: clamp(
                25px,
                4vw,
                40px
            );

            color: #493b3e;

            margin-bottom: 30px;
        }


        /* PHOTO */

        .photo-frame {

            width: 280px;

            height: 350px;

            margin: 0 auto 30px;

            padding: 8px;

            background: white;

            border: 1px solid #dfc4c0;

            box-shadow:
                0 15px 40px
                rgba(80, 50, 50, 0.18);
        }


        .photo-frame img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .message {

            font-size: 20px;

            color: #67585b;

            line-height: 1.7;
        }


        .date {

            margin-top: 15px;

            color: #a96c70;

            font-size: 17px;

            letter-spacing: 2px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .photo-frame {

                width: 220px;

                height: 280px;

            }

            .title {

                font-size: 55px;

            }

            .message {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


    }
}


<!-- FALLING ROSE PETALS -->

<div class="petal" style="left:5%; animation-duration:9s;"></div>

<div class="petal" style="left:15%; animation-duration:12s; animation-delay:2s;"></div>

<div class="petal" style="left:25%; animation-duration:10s; animation-delay:1s;"></div>

<div class="petal" style="left:35%; animation-duration:13s; animation-delay:3s;"></div>

<div class="petal" style="left:45%; animation-duration:9s; animation-delay:2s;"></div>

<div class="petal" style="left:55%; animation-duration:11s; animation-delay:4s;"></div>

<div class="petal" style="left:65%; animation-duration:10s; animation-delay:1s;"></div>

<div class="petal" style="left:75%; animation-duration:12s; animation-delay:3s;"></div>

<div class="petal" style="left:85%; animation-duration:9s; animation-delay:2s;"></div>

<div class="petal" style="left:95%; animation-duration:11s; animation-delay:4s;"></div>

    <!-- MAIN -->

    <div class="anniversary-content">


        <div class="small-heading">
            To My Love
        </div>


        <h1 class="title">
            HAPPY<br>
            ANNIVERSARY
        </h1>


        <div class="names">
            Swetha ❤️ Satya Prakash
        </div>


        <!-- YOUR PHOTO -->

        <div class="photo-frame">

            <img
                src="our-photo.jpg"
                alt="Swetha and Satya Prakash">

        </div>


        <p class="message">

            Every moment with you
            is a beautiful memory. ❤️

        </p>


        <div class="date">

            23 • 11 • 2023

        </div>


    </div>


</body>

</html>
