
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Anniversary ❤️</title>

<style>

/* RESET */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ROMANTIC BACKGROUND */

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family: Georgia, "Times New Roman", serif;

    background:
        radial-gradient(
            circle at 10% 15%,
            rgba(255, 210, 215, 0.8),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(238, 194, 174, 0.7),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 50%,
            #fffdf9,
            #f8e3e3,
            #f3d4d3
        );

    display: flex;
    justify-content: center;
    align-items: flex-start;

    text-align: center;
    position: relative;

    padding: 45px 15px 60px;
}

/* DECORATIVE BORDER */

body::before {
    content: "";
    position: fixed;
    inset: 15px;

    border: 1px solid rgba(180, 120, 100, 0.4);
    border-radius: 25px;

    pointer-events: none;
    z-index: 4;
}

/* SOFT BACKGROUND GLOW */

body::after {
    content: "";
    position: fixed;

    width: 350px;
    height: 350px;

    background: rgba(255, 255, 255, 0.35);

    filter: blur(80px);
    border-radius: 50%;

    top: 10%;
    left: 50%;

    transform: translateX(-50%);

    pointer-events: none;
    z-index: 0;
}

/* FALLING ROSE PETALS */

.petal {
    position: fixed;
    top: -40px;

    width: 18px;
    height: 25px;

    background: linear-gradient(
        135deg,
        #a65162,
        #f2728c,
        #f55d5d
    );

    border-radius: 80% 0 80% 0;

    opacity: 0.85;

    z-index: 2;
    pointer-events: none;

    animation: petalFall linear infinite;
}

@keyframes petalFall {

    0% {
        transform: translateY(-40px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 0.9;
    }

    50% {
        transform:
            translateY(50vh)
            translateX(35px)
            rotate(180deg);
    }

    100% {
        transform:
            translateY(110vh)
            translateX(-35px)
            rotate(360deg);

        opacity: 0;
    }
}

/* MAIN CONTENT */

.anniversary-content {
    position: relative;
    z-index: 5;

    width: 100%;
    max-width: 850px;

    padding: 20px;
}

/* SMALL HEADING */

.small-heading {
    font-size: 18px;
    letter-spacing: 5px;

    color: #80676a;
    text-transform: uppercase;

    margin-bottom: 15px;
}

/* MAIN TITLE */

.title {
    font-size: clamp(48px, 9vw, 100px);

    font-weight: normal;

    color: #9d6267;

    line-height: 1.05;

    margin-bottom: 20px;

    text-shadow:
        0 2px 10px rgba(180, 100, 110, 0.15);
}

/* COUPLE NAMES */

.names {
    font-size: clamp(23px, 4vw, 40px);

    color: #493b3e;

    margin-bottom: 30px;
}

/* LUXURY ROSE GOLD PHOTO FRAME */

.photo-frame {
    position: relative;

    width: 350px;
    height: 430px;

    margin: 35px auto 40px;
    padding: 12px;

    background: linear-gradient(
        135deg,
        #f8e6c8,
        #bd875f,
        #fff1d9,
        #bd875f
    );

    border: 3px solid #bd875f;
    border-radius: 28px;

    box-shadow:
        0 0 0 5px #fffaf4,
        0 0 0 8px #d7ad8b,
        0 15px 40px rgba(120, 65, 65, 0.25);

    transition: transform 0.4s ease;
}

/* PHOTO */

.photo-frame img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border: 3px solid #fffaf4;
    border-radius: 17px;
}

/* DECORATIVE FRAME CORNERS */

.photo-frame::before,
.photo-frame::after {
    content: "❦";

    position: absolute;

    color: #a96c70;
    font-size: 30px;

    z-index: 2;
}

.photo-frame::before {
    top: -17px;
    left: -12px;
}

.photo-frame::after {
    bottom: -17px;
    right: -12px;
}

/* PHOTO HOVER */

.photo-frame:hover {
    transform: scale(1.025);
}

/* MESSAGE */

.message {
    font-size: 20px;

    color: #67585b;

    line-height: 1.7;

    margin-top: 15px;
}

/* ANNIVERSARY DATE */

.date {
    margin-top: 18px;

    color: #a96c70;

    font-size: 18px;

    letter-spacing: 3px;
}

/* BOTTOM TEXT */

.bottom-text {
    margin-top: 25px;

    font-size: 17px;

    color: #a96c70;

    font-style: italic;
}

/* MOBILE RESPONSIVE */

@media (max-width: 600px) {

    body {
        padding: 35px 12px 50px;
    }

    .anniversary-content {
        padding: 15px 5px;
    }

    .small-heading {
        font-size: 14px;
        letter-spacing: 4px;
    }

    .title {
        font-size: 52px;
    }

    .names {
        font-size: 25px;
    }

    .photo-frame {
        width: 250px;
        height: 310px;
    }

    .message {
        font-size: 17px;
    }

    .date {
        font-size: 15px;
    }

    .bottom-text {
        font-size: 15px;
    }
}

</style>

</head>

<body>

<!-- FALLING ROSE PETALS -->

<div class="petal" style="left:5%; animation-duration:9s;"></div>

<div class="petal" style="left:15%; animation-duration:12s; animation-delay:2s;"></div>

<div class="petal" style="left:25%; animation-duration:10s; animation-delay:1s;"></div>

<div class="petal" style="left:35%; animation-duration:13s; animation-delay:3s;"></div>

<div class="petal" style="left:45%; animation-duration:9s; animation-delay:2s;"></div>

<div class="petal" style="left:55%; animation-duration:11s; animation-delay:4s;"></div>

<div class="petal" style="left:65%; animation-duration:10s; animation-delay:1s;"></div>

<div class="petal" style="left:75%; animation-duration:12s; animation-delay:3s;"></div>

<div class="petal" style="left:85%; animation-duration:9s; animation-delay:2s;"></div>

<div class="petal" style="left:95%; animation-duration:11s; animation-delay:4s;"></div>


<!-- MAIN ANNIVERSARY CONTENT -->

<div class="anniversary-content">

    <div class="small-heading">
        To My Love
    </div>

    <h1 class="title">
        HAPPY<br>
        ANNIVERSARY
    </h1>

    <div class="names">
        Swetha ❤️ Satya Prakash
    </div>

    <!-- YOUR PHOTO -->

    <div class="photo-frame">

        <img
            src="our photo.jpeg"
            alt="Swetha and Satya Prakash"
        >

    </div>

    <p class="message">
        Every moment with you<br>
        is a beautiful memory. ❤️
    </p>

    <div class="date">
        23 • 11 • 2023
    </div>

    <div class="bottom-text">
        Forever Together ❤️
    </div>

</div>

</body>
</html>
